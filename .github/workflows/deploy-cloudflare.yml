{
  "name": "Deploy Cloudflare production",
  "on": { "push": { "branches": ["main"] } },
  "permissions": { "contents": "read" },
  "concurrency": { "group": "motion-cricket-production", "cancel-in-progress": false },
  "jobs": {
    "deploy": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        { "uses": "actions/checkout@v6" },
        {
          "uses": "actions/setup-node@v6",
          "with": { "node-version": "22", "cache": "npm", "cache-dependency-path": "web/package-lock.json" }
        },
        {
          "name": "Verify deployment secrets",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          },
          "run": "test -n \"$CLOUDFLARE_API_TOKEN\" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }\ntest -n \"$CLOUDFLARE_ACCOUNT_ID\" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }"
        },
        { "name": "Install locked web dependencies", "run": "npm --prefix web ci" },
        {
          "name": "Focused session and phone tests",
          "working-directory": "web",
          "run": "node tests/public-session.cjs\nnpm run test:phone"
        },
        { "name": "Typecheck and production build", "run": "npm --prefix web run build" },
        {
          "name": "Deploy existing production Worker and static assets",
          "uses": "cloudflare/wrangler-action@v4",
          "with": {
            "apiToken": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "accountId": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}",
            "wranglerVersion": "4.147.0",
            "command": "deploy --config wrangler.jsonc"
          }
        }
      ]
    }
  }
}
